[workspace]
resolver = "3"
members = ["crates/ruststream-sea-file"]

[workspace.package]
version = "0.7.0"
edition = "2024"
# 1.88 holds here independently of the core's own floor: the RustSec fix for the time
# crate (a sea-streamer dependency) resolves only from 1.88, and a dependent may exceed
# its dependency's floor.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream-sea-file"
authors = ["RustStream contributors"]

[workspace.dependencies]
ruststream-sea-file = { path = "crates/ruststream-sea-file" }

ruststream = { version = ">=0.7.0, <0.8.0", default-features = false }

# The 1.0 release-candidate line: edition 2024 and a 1.85 floor, comfortably under this
# workspace's own (the 0.5 stable line is over a year older). Pre-releases must be pinned
# explicitly.
# The client's runtime features are mutually exclusive upstream; tokio is this project's
# hardcoded runtime, so it is forwarded unconditionally - without it the build compiles and
# then panics at runtime.
sea-streamer-types = { version = "=1.0.0-rc.1", default-features = false }
sea-streamer-file = { version = "=1.0.0-rc.1", default-features = false, features = ["runtime-tokio"] }
sea-streamer-stdio = { version = "=1.0.0-rc.1", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
bytes = "1"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"
