[package]
name = "ruststream-sea-file"
description = "File and stdio stream implementation of the RustStream broker contract, built on sea-streamer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["file", "stdio", "streaming", "broker", "ruststream"]
categories = ["asynchronous", "network-programming"]

# The in-process mode and the AsyncAPI extension are off by default, so a default build on docs.rs
# would publish a reference without the testing example and without what a subscription
# contributes to the generated document - the parts the crate overview sends readers to.
# Every file under `tests/` is a module of one test binary, the two stdio suites aside: one link
# instead of one per file.
autotests = false

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = []
# The brokers' in-process mode: `TestApp::start` connects `FileBroker` and `StdioBroker` with no
# file and no pipe. A service enables it in its dev-dependencies. The conformance harness is a
# broker-author tool and stays in this repo's dev-dependencies, not in the user-facing feature.
testing = ["ruststream/testing"]
# What this crate adds to a generated AsyncAPI document. The specification lists no binding for a
# file transport or for stdio, so what a subscription knows travels in an `x-` extension.
asyncapi = ["ruststream/asyncapi", "dep:serde"]

[dependencies]
ruststream = { workspace = true, default-features = false }
sea-streamer-types.workspace = true
sea-streamer-file.workspace = true
sea-streamer-stdio.workspace = true
base64.workspace = true
bytes.workspace = true
serde = { workspace = true, optional = true }
futures.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
ruststream = { workspace = true, features = [
    "conformance",
    "testing",
    "macros",
    "json",
    "asyncapi",
] }
serde.workspace = true
serde_json.workspace = true
# Builds the examples' tests into one test binary (`tests/examples.rs`) instead of a test binary
# per example. It lives in the core repository and is not published: a dev-dependency without a
# version is dropped on publish.
ruststream-example-suite = { git = "https://github.com/powersemmi/ruststream", branch = "main" }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    # The stdio pipeline suite drives the shipped stage as a child process, over piped
    # standard input and output.
    "process",
    "io-util",
    # The driver's unit tests run on a paused clock, so a seek that never completes fails at
    # once instead of waiting out a real timeout.
    "test-util",
] }

[[test]]
name = "suite"
path = "tests/main.rs"

# The tests of the examples, one module per example, in a binary of their own beside the suite.
[[test]]
name = "examples"
path = "tests/examples.rs"

# The two stdio suites own their process: they attach the process's standard input and output,
# and shutting the transport down ends every stdio consumer and producer in the process.
[[test]]
name = "connect_runtime_stdio"
path = "tests/connect_runtime_stdio.rs"

[[test]]
name = "stdio_retry"
path = "tests/stdio_retry.rs"

