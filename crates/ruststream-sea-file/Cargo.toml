[package]
name = "ruststream-sea-file"
description = "File and stdio stream implementation of the RustStream broker contract, built on sea-streamer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["file", "stdio", "streaming", "broker", "ruststream"]
categories = ["asynchronous", "network-programming"]

[lints]
workspace = true

[features]
default = []
# The in-process test broker (TestableBroker + TestApp support). The conformance harness is a
# broker-author tool and stays in this repo's dev-dependencies, not in the user-facing feature.
testing = ["ruststream/testing"]

[dependencies]
ruststream = { workspace = true, default-features = false }
sea-streamer-types.workspace = true
sea-streamer-file.workspace = true
sea-streamer-stdio.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
ruststream = { workspace = true, features = ["conformance", "testing", "macros", "json"] }
serde = { version = "1", features = ["derive"] }
# 1.0.85 rather than 1: serde_json 1.0.0 declares only `serde = "1.0"` while calling into
# `BorrowedStrDeserializer` and the 128-bit methods, so the pair it claims to accept does not
# build. Naming a floor that works keeps the resolution honest instead of pinning it downstream.
serde_json = "1.0.85"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
